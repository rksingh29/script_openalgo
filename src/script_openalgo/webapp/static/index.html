<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategy Lab</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2230; --mute:#667085; --line:#e3e6ec; --acc:#2457d6; --pos:#0b7a46; --neg:#c0262d;
          --warn:#b25e00; --chip:#eef1f6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151c; --card:#1a1f2a; --ink:#e7eaf1; --mute:#98a1b3; --line:#2a3141;
          --acc:#6b95ff; --pos:#3ecf8e; --neg:#ff6b72; --warn:#f0a040; --chip:#252c3a; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  h1 { font-size:16px; margin:0 12px 0 0; }
  main { padding:16px; max-width:1300px; margin:0 auto; }
  button, select, input { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:5px 10px; }
  button { cursor:pointer; } button:hover { border-color:var(--acc); } button:disabled { opacity:.5; cursor:default; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  button.danger { color:var(--neg); }
  nav { display:flex; gap:4px; margin-bottom:12px; flex-wrap:wrap; }
  nav button { border-radius:6px; } nav button.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:12px; overflow-x:auto; }
  table { border-collapse:collapse; width:100%; } th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-weight:600; color:var(--mute); font-size:12px; white-space:nowrap; } tr.click:hover { background:var(--chip); cursor:pointer; } tr.click.on { background:var(--chip); }
  .num { text-align:right; font-variant-numeric:tabular-nums; } .pos { color:var(--pos); } .neg { color:var(--neg); } .mute { color:var(--mute); }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; background:var(--chip); font-size:12px; white-space:nowrap; }
  .badge.in_progress, .badge.running { background:#2457d622; color:var(--acc); }
  .badge.tested, .badge.ok { background:#0b7a4622; color:var(--pos); }
  .badge.waiting { background:#b25e0022; color:var(--warn); }
  .badge.failed { background:#c0262d22; color:var(--neg); }
  .badge.needs_review, .badge.needs_input { background:#b25e0022; color:var(--warn); }
  .badge.untestable, .badge.cancelled, .badge.archived { color:var(--mute); }
  .spin { display:inline-block; width:10px; height:10px; border:2px solid var(--acc); border-right-color:transparent; border-radius:50%; animation:sp 0.9s linear infinite; margin-right:4px; vertical-align:-1px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .banner { background:#b25e0022; border:1px solid var(--warn); color:var(--warn); padding:8px 12px; border-radius:8px; margin-bottom:12px; }
  .modal { position:fixed; inset:0; background:#0007; display:flex; align-items:flex-start; justify-content:center; padding:30px 12px; overflow:auto; z-index:20; }
  .modal[hidden] { display:none; }
  .modal > div { background:var(--card); border-radius:10px; padding:16px; max-width:900px; width:100%; }
  pre { background:var(--chip); padding:8px; border-radius:6px; overflow:auto; max-height:280px; white-space:pre-wrap; word-break:break-word; margin:6px 0; }
  .kv { display:grid; grid-template-columns:140px 1fr; gap:4px 10px; } .kv div:nth-child(odd) { color:var(--mute); }
  .chip { display:inline-block; margin:3px 4px 0 0; padding:0 8px; border-radius:10px; background:var(--chip); font-size:11px; color:var(--mute); cursor:pointer; }
  .chip:hover { color:var(--acc); }
  .chip.on, .tagbtn.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  textarea { width:100%; font:12px/1.45 ui-monospace, Consolas, "Cascadia Mono", monospace; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:8px; tab-size:4; resize:vertical; }
  textarea.rule { font:13px/1.4 system-ui, "Segoe UI", sans-serif; }
  .field { margin-bottom:10px; } .field > label { display:block; color:var(--mute); font-size:12px; margin-bottom:2px; }
  .ok { color:var(--pos); }
  .small { font-size:12px; } label { display:inline-flex; gap:5px; align-items:center; }
  @media (max-width:640px) { main { padding:10px; } .kv { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>Strategy Lab</h1>
  <label class="small">Workspace <select id="ws"></select></label>
  <button id="addws" class="small">+ workspace</button>
  <button id="rescan" class="small" title="Re-read the strategies and result folders of this workspace into the app (picks up command-line runs)">↻ Rescan folders</button>
  <span style="flex:1"></span>
  <button id="seed" class="primary" title="One-time seed run: research 10 unique strategies">Research: seed 10</button>
  <button id="daily" class="primary" title="Look for 1 new unique strategy">Research: find 1 new</button>
  <span id="usage" class="small mute" title="Claude calls in the last hour / last 24 h (budget in the Jobs tab)"></span>
  <label title="Test the next queued strategy automatically, one at a time"><input type="checkbox" id="auto"> Auto-run queue</label>
</header>
<main>
  <div id="banner"></div>
  <nav id="tabs"></nav>
  <div id="view"></div>
</main>
<div id="modal" class="modal" hidden><div id="modalbody"></div></div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const st = { backup: null, importReport: null, tab: "strategies", data: null, filter: { status: "", tag: "", archived: false, q: "" }, resultsMode: "date", dataList: null, results: null, page: null };

function h(tag, attrs, ...kids) {                       // safe DOM builder: text only, never innerHTML
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
async function api(path, body) {
  const opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json", "X-Requested-With": "strategy-lab" }, body: JSON.stringify(body) };
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function findDuplicates(runs) {
  // Older runs of the same strategy, instrument, day, executor and options as a newer run. "same": identical result
  // (trades and gross P&L) to the newest one, so nothing is lost. "changed": a different result (usually older code).
  const groups = {};
  runs.forEach(r => { const k = [r.strategy_id, r.instrument, r.day, r.executor || "option", r.params || ""].join("|"); (groups[k] = groups[k] || []).push(r); });
  const same = [], changed = [];
  Object.values(groups).forEach(g => {
    if (g.length < 2) return;
    g.sort((a, b) => b.id - a.id);
    const newest = g[0];
    g.slice(1).forEach(r => (r.trades === newest.trades && Math.abs((r.gross_pnl || 0) - (newest.gross_pnl || 0)) < 0.01 ? same : changed).push(r.id));
  });
  return { same, changed };
}
function dupButtons(runs, done) {
  const dup = findDuplicates(runs);
  if (!dup.same.length && !dup.changed.length) return h("span", { class: "mute small" }, "no duplicate runs");
  return h("span", { class: "row small", style: "gap:4px" },
    dup.same.length ? h("button", { class: "danger small", title: "Older runs of the same day with exactly the same result as the newest run. Stats already use only the newest run, so nothing changes in the numbers.",
      onclick: () => done(() => deleteRuns(dup.same)) }, `Remove ${dup.same.length} duplicate${dup.same.length > 1 ? "s" : ""}`) : null,
    dup.changed.length ? h("button", { class: "small", title: "Older runs of the same day whose result differs from the newest run (usually an earlier version of the code). Kept unless you remove them here.",
      onclick: () => done(() => deleteRuns(dup.changed)) }, `Remove ${dup.changed.length} superseded older run${dup.changed.length > 1 ? "s" : ""}`) : null);
}
async function deleteRuns(ids) {     // true if deleted
  if (!ids.length || !confirm(`Delete ${ids.length} run(s) from the results?`)) return false;
  const files = confirm(["Also delete the result folders on disk (trades, summary, log)?", "", "OK = delete the files too",
    "Cancel = keep the files (the runs will not come back on the next sync)"].join(String.fromCharCode(10)));
  await api("/api/runs/delete", { ids, delete_files: files });
  return true;
}
const act = async (fn) => { try { await fn(); } catch (e) { alert(e.message); } refresh(); };
const money = (v) => v == null ? "–" : h("span", { class: v > 0 ? "pos" : v < 0 ? "neg" : "" }, (v > 0 ? "+" : "") + Math.round(v));
const badge = (s, spin) => h("span", { class: "badge " + s }, spin ? h("span", { class: "spin" }) : null, s.replace("_", " "));
const dt = (s) => s ? s.replace("T", " ").slice(5, 16) : "";

// ---------- header ----------
function renderHeader() {
  const d = st.data;
  const sel = $("#ws"); sel.replaceChildren(...Object.keys(d.workspaces).map(n => h("option", { value: n, selected: n === d.workspace }, n)));
  $("#auto").checked = d.auto_run;
  const u = d.usage; $("#usage").textContent = `Claude: ${u.hour}/${u.settings.claude_max_per_hour} per hour · ${u.day}/${u.settings.claude_max_per_day} today`;
  const rr = d.jobs.some(j => j.kind === "research" && j.status === "running");
  $("#seed").disabled = $("#daily").disabled = rr;
  $("#seed").textContent = rr ? "Researcher running…" : "Research: seed 10";
  $("#banner").replaceChildren(d.key_present ? "" : h("div", { class: "banner" }, "OPENALGO_API_KEY not found (environment or .env). Data fetch and backtests cannot run."),
    d.paused_until ? h("div", { class: "banner" }, "Claude usage limit reached. Agent jobs (research, strategy writing, review) are paused until about " + d.paused_until.replace("T", " ") + ". Queued strategies keep their place.") : "");
}
$("#ws").onchange = (e) => act(() => api("/api/workspaces/activate", { name: e.target.value }));
$("#rescan").onclick = () => act(async () => { const r = await api("/api/sync", {}); alert(`Rescan done: ${r.registered} strategies registered, ${r.runs_imported} results imported.`); });
$("#addws").onclick = () => { const n = prompt("New workspace name (letters, digits, _ -). It gets its own database file and candle-cache folder:"); if (n) act(() => api("/api/workspaces", { name: n, activate: confirm("Switch to it now?") })); };
$("#seed").onclick = () => confirm("Research 10 unique strategies (one-time seed)? This uses Claude web searches and may take several minutes.") && act(() => api("/api/research", { mode: "seed" }));
$("#daily").onclick = () => act(() => api("/api/research", { mode: "daily" }));
$("#auto").onchange = (e) => act(() => api("/api/auto", { on: e.target.checked }));

const TABS = [["strategies", "Strategies"], ["results", "Results"], ["data", "Data"], ["selector", "Selector"], ["live", "Live"], ["trade", "Trade"], ["signals", "Signals"], ["instruments", "Instruments"], ["jobs", "Jobs"], ["logs", "Logs"], ["backup", "Backup"]];
function renderTabs() {
  $("#tabs").replaceChildren(...TABS.map(([k, l]) => h("button", { class: st.tab === k ? "on" : "", onclick: () => { st.tab = k; refresh(); } }, l)));
}

// ---------- strategies ----------
function strategiesView() {
  const d = st.data, f = st.filter;
  const statuses = ["", "queued", "in_progress", "waiting", "tested", "failed", "needs_review", "untestable"];
  const list = d.strategies.filter(s => (f.archived ? !!s.archived_at : !s.archived_at) && (!f.status || s.status === f.status) && (!f.tag || s.tags.includes(f.tag)) &&
    (!f.q || (s.name + " " + s.family + " " + s.aliases.join(" ") + " " + s.tags.join(" ")).toLowerCase().includes(f.q.toLowerCase())));
  const tagCounts = {}; d.strategies.filter(s => !s.archived_at).forEach(s => s.tags.forEach(t => tagCounts[t] = (tagCounts[t] || 0) + 1));
  const ctl = h("div", { class: "row", style: "margin-bottom:10px" },
    h("select", { onchange: (e) => { f.status = e.target.value; render(); } }, statuses.map(s => h("option", { value: s, selected: s === f.status }, s || "all statuses"))),
    h("select", { onchange: (e) => { f.tag = e.target.value; render(); } }, h("option", { value: "" }, "all tags"), Object.keys(tagCounts).sort().map(t => h("option", { value: t, selected: t === f.tag }, `${t} (${tagCounts[t]})`))),
    h("label", {}, h("input", { type: "checkbox", checked: f.archived, onchange: (e) => { f.archived = e.target.checked; render(); } }), "archived"),
    h("input", { placeholder: "search…", value: f.q, oninput: (e) => { f.q = e.target.value; clearTimeout(st.qt); st.qt = setTimeout(render, 250); }, id: "q" }),
    h("span", { class: "mute small" }, `${list.length} shown · queue: ${d.strategies.filter(s => s.status === "queued" && !s.archived_at).length} waiting`));
  const rows = list.map(s => {
    const running = s.status === "in_progress";
    const inst = h("select", { class: "small", id: "inst" + s.id }, d.instruments.map(i => h("option", { value: i }, i)));
    const date = h("input", { type: "date", class: "small", id: "date" + s.id, title: "empty = previous trading day" });
    return h("tr", {},
      h("td", { class: "num mute" }, s.queue_pos || ""),
      h("td", {}, h("a", { href: "#/strategy/" + s.id, style: "color:inherit;font-weight:600" }, s.name), h("div", { class: "mute small" }, s.family + " · " + s.origin + (s.pinned ? " · pinned" : "") + (s.code_edited_at ? " · edited" : "")),
        h("div", {}, s.tags.map(t => h("span", { class: "chip", onclick: () => { st.filter.tag = t; render(); } }, t)))),
      h("td", {}, badge(s.archived_at ? "archived" : s.status, running), running ? progressBox(s) : (s.status_note ? h("div", { class: "small mute" }, s.status_note) : null)),
      h("td", { class: "small" }, s.testable + (s.testable_reason ? " – " + s.testable_reason.slice(0, 60) : "")),
      h("td", {}, s.stats ? Object.entries(s.stats).map(([ins, x]) => h("div", { class: "small" }, h("b", {}, ins + " "), `${x.days}d · total `, money(x.total), " · avg ", money(x.avg), x.low_sample ? h("span", { class: "mute" }, " · low sample") : null, x.far_days ? h("span", { class: "mute", title: "days where the cached contract was not the nearest expiry; not in the numbers above" }, ` · +${x.far_days} far-expiry day(s) ${x.far_total >= 0 ? "+" : ""}${Math.round(x.far_total)}`) : null)) : h("span", { class: "mute" }, "–")),
      h("td", {}, h("div", { class: "row" }, inst, date,
        running ? h("button", { class: "danger", onclick: () => confirm("Stop this test and put the strategy back in the queue?") && act(() => api(`/api/strategies/${s.id}/stop`, {})) }, s.job ? "Stop" : "Reset") : h("button", { disabled: s.testable === "no", onclick: () => act(() => api(`/api/strategies/${s.id}/run`, { instrument: $("#inst" + s.id).value, date: $("#date" + s.id).value })) }, "Run"),
        h("button", { onclick: () => act(() => api(`/api/strategies/${s.id}/pin`, {})) }, s.pinned ? "Unpin" : "Pin"),
        (s.status === "failed" || s.status === "needs_review" || s.status === "waiting") ? h("button", { onclick: () => act(() => api(`/api/strategies/${s.id}/requeue`, {})) }, "Re-queue") : null,
        h("button", { onclick: () => act(() => api(`/api/strategies/${s.id}/archive`, { on: !s.archived_at })) }, s.archived_at ? "Unarchive" : "Archive"),
        h("button", { class: "danger", onclick: () => deleteStrategy(s) }, "Delete"))));
  });
  return h("div", {}, ctl, h("div", { class: "card" }, h("table", {},
    h("thead", {}, h("tr", {}, ["#", "Strategy", "Status", "Testable", "Performance (gross, latest run per day)", "Actions"].map(t => h("th", {}, t)))),
    h("tbody", {}, rows.length ? rows : h("tr", {}, h("td", { colspan: 6, class: "mute" }, "No strategies yet. Click “Research: seed 10”."))))),
    researchLog());
}
function progressBox(s) {
  if (!s.job) return h("div", { class: "small neg" }, "stuck: no job is running. Click Reset, then Run again.");
  const mins = s.job.started ? Math.max(0, Math.round((Date.now() - new Date(s.job.started.replace(" ", "T")).getTime()) / 60000)) : 0;
  const pct = s.pct;
  return h("div", { class: "small mute" },
    pct != null ? h("div", { style: "background:#8883;border-radius:3px;height:6px;margin:4px 0;width:140px" }, h("div", { style: `background:var(--acc);height:6px;border-radius:3px;width:${pct}%` })) : null,
    (pct != null ? pct + "% · " : "") + (s.phase || s.job.kind) + " · " + mins + " min" + (s.status_note ? " · " + s.status_note : ""));
}
function researchLog() {
  const l = st.data.research_log;
  if (!l.length) return null;
  return h("div", { class: "card" }, h("b", {}, "Researcher activity"), h("table", {}, h("tbody", {}, l.map(r => h("tr", {}, h("td", { class: "mute small" }, dt(r.ts)), h("td", {}, badge(r.action === "added" ? "ok" : r.action)), h("td", {}, r.detail))))));
}
function deleteStrategy(s) {
  const t = prompt(`Delete “${s.name}” and all its runs from the database?\nThe strategy won't be re-added by the researcher. Strategy .py files are never deleted.\n\nType DELETE to confirm:`);
  if (t !== "DELETE") return;
  act(() => api(`/api/strategies/${s.id}/delete`, { confirm: "DELETE", delete_files: confirm("Also delete the saved backtest result folders for its runs?") }));
}

async function openStrategy(id) {
  const d = await api("/api/strategies/" + id);
  const spec = d.spec || {};
  const keys = ["family", "timeframe", "indicators", "entry_trigger", "exit_type", "entry_long", "entry_short", "exit", "stop", "target", "filters", "params", "data_needs", "testable_reason", "notes"];
  const kv = h("div", { class: "kv" }, keys.filter(k => spec[k] != null && spec[k] !== "").flatMap(k => [h("div", {}, k), h("div", {}, typeof spec[k] === "object" ? JSON.stringify(spec[k]) : String(spec[k]))]));
  const srcs = (d.sources || []).map(s => h("div", { class: "small" }, /^https?:\/\//i.test(s.url || "") ? h("a", { href: s.url, target: "_blank", rel: "noopener noreferrer" }, s.title || s.url) : (s.title || "source"), h("span", { class: "mute" }, " · " + (s.type || ""))));
  const runs = h("table", {}, h("thead", {}, h("tr", {}, ["Date", "Instrument", "Trades", "P&L", "Win rate", "Max DD", "Review", ""].map(t => h("th", {}, t)))),
    h("tbody", {}, d.runs.map(r => h("tr", { class: "click", onclick: () => openRun(r.id) }, h("td", {}, r.day), h("td", {}, r.instrument), h("td", {}, r.trades), h("td", {}, money(r.gross_pnl)),
      h("td", {}, r.win_rate == null ? "–" : Math.round(r.win_rate * 100) + "%"), h("td", {}, r.max_dd == null ? "–" : Math.round(r.max_dd)), h("td", {}, r.verdict || ""),
      h("td", {}, h("button", { class: "danger small", onclick: (e) => { e.stopPropagation(); act(async () => { if (await deleteRuns([r.id])) closeModal(); }); } }, "×"))))));
  showModal(h("div", {}, h("div", { class: "row" }, h("h3", { style: "margin:0" }, d.name), badge(d.status), h("span", { style: "flex:1" }), h("button", { onclick: closeModal }, "Close")),
    d.aliases && d.aliases.length ? h("div", { class: "mute small" }, "Also known as: " + d.aliases.join(", ")) : null,
    h("h4", {}, "Rules"), kv, h("h4", {}, "Sources"), srcs.length ? srcs : h("div", { class: "mute small" }, "none"),
    h("h4", {}, "Runs"), d.runs.length ? runs : h("div", { class: "mute small" }, "No runs yet."),
    h("h4", {}, "Jobs"), h("div", { class: "small" }, d.jobs.map(j => h("div", {}, `#${j.id} ${j.label} – ${j.status} ${j.phase || ""} ${dt(j.started)}`)))));
}
async function openRun(id) {
  const r = await api("/api/runs/" + id);
  const t = r.trade_rows.length ? h("table", {}, h("thead", {}, h("tr", {}, ["Cycle", "Symbol", "Qty", "Entry", "Exit", "P&L"].map(x => h("th", {}, x)))),
    h("tbody", {}, r.trade_rows.map(x => h("tr", {}, h("td", {}, x.cycle), h("td", {}, x.symbol), h("td", {}, x.qty), h("td", {}, `${x.entry_time} @ ${x.entry_price}`), h("td", {}, `${x.exit_time} @ ${x.exit_price}`), h("td", {}, money(+x.gross_pnl)))))) : h("div", { class: "mute" }, "No trades.");
  showModal(h("div", {}, h("div", { class: "row" }, h("h3", { style: "margin:0" }, `Run ${r.day} · ${r.instrument}`), h("span", { style: "flex:1" }),
      h("button", { class: "danger", onclick: () => act(async () => { if (await deleteRuns([r.id])) closeModal(); }) }, "Delete run"), h("button", { onclick: closeModal }, "Close")),
    r.summary ? h("pre", {}, JSON.stringify(r.summary, null, 1)) : null, t, chartBox(id), h("h4", {}, "Log (tail)"), h("pre", {}, r.log_tail || "no log")));
}

// ---------- trade chart: index for the day + each trade's option premium, with what-if exits/entries ----------
function chartBox(runId) {
  const box = h("div", {}, h("h4", {}, "Chart"), h("div", { class: "mute small" }, "loading…"));
  api("/api/runs/" + runId + "/chart").then(c => box.replaceChildren(h("h4", {}, "Chart"), chartView(c)))
    .catch(() => box.replaceChildren(h("h4", {}, "Chart"), h("div", { class: "mute small" }, "Chart data not in the candle cache for this day.")));
  return box;
}
const tmin = (t) => { const p = t.split(":"); return +p[0] * 60 + +p[1]; };
function svgLine(pts, x, y, color) { return `<polyline fill="none" stroke="${color}" stroke-width="1.5" points="${pts.map(p => x(p[0]).toFixed(1) + "," + y(p[1]).toFixed(1)).join(" ")}"/>`; }
function chartView(c, initSel, onSel) {

        h("td", {}, h("button", { class: "danger small", onclick: () => confirm("Delete this backup file?") && act(() => api("/api/backup/delete", { name: i.name })) }, "Delete")))) : h("tr", {}, h("td", { class: "mute" }, "none yet"))))),
    h("div", { class: "card" }, h("b", {}, "Import a backup"),
      h("div", { class: "banner small", style: "margin-top:6px" }, "Importing replaces the databases of this workspace with the ones in the backup. A safety backup of the current state is made first. Files that already exist are kept unless you tick overwrite. Stop running jobs first. Start with “check only”."),
      h("div", { class: "row", style: "margin:8px 0" }, file, h("label", {}, dry, "check only (change nothing)"), h("label", {}, ow, "overwrite files that differ"), h("button", { class: "primary", onclick: doImport }, "Verify / Import")),
      repView || ""));
}

// ---------- loop ----------
function render() {
  if (!st.data) return;
  if (st.page) {                                    // never rebuild the editor on a poll; only refresh header and status badge
    renderHeader();
    const el = $("#pstatus"), live = st.page.d && st.data.strategies.find(x => x.id === st.page.d.id);
    if (el && live) el.replaceChildren(badge(live.archived_at ? "archived" : live.status, live.status === "in_progress"), live.status === "in_progress" ? " " + (live.phase || "") + " " + (live.status_note || "") : "");
    return;
  }
  renderHeader(); renderTabs();
  const v = { strategies: strategiesView, results: resultsView, data: dataView, instruments: instrumentsView, selector: selectorView, live: liveView, trade: tradeView, signals: signalsView, jobs: jobsView, logs: logsView, backup: backupView }[st.tab]();
  const focus = document.activeElement && document.activeElement.id === "q";
  const lb = st.tab === "logs" && $("#logbody");                 // preserve scroll/read position of a log box across the 3s poll re-render
  const lbState = lb ? { top: lb.scrollTop, atBottom: lb.scrollTop + lb.clientHeight >= lb.scrollHeight - 4 } : null;
  $("#view").replaceChildren(v);
  if (focus) { const q = $("#q"); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  if (lbState) { const ne = $("#logbody"); if (ne) ne.scrollTop = lbState.atBottom ? ne.scrollHeight : lbState.top; }
}
async function refresh() {
  try {
    if (document.activeElement && ["INPUT", "SELECT"].includes(document.activeElement.tagName) && document.activeElement.id !== "q" && st.data) {
      if (!st.page && st.tab === "live") await loadLive();       // keep the Live desk's sounds going; just do not redraw
      return;                                                   // do not clobber what the user is editing
    }
    st.data = await api("/api/state");
    if (!st.page && st.tab === "results") st.results = await api("/api/results");
    if (!st.page && st.tab === "data") st.dataList = await api("/api/data");
    if (!st.page && st.tab === "instruments" && !st.instBusy) st.instList = await api("/api/instruments");
    if (!st.page && st.tab === "signals") await loadSignals();
    if (!st.page && st.tab === "logs") await loadLogs();
    if (!st.page && st.tab === "trade") await loadTrade();
    if (!st.page && st.tab === "selector" && !(st.selr && st.selr.busy)) await loadSelector();
    if (!st.page && st.tab === "live") { if (!st.selr || !st.selr.settings || Date.now() - (st.selr.at || 0) > 60000) { await loadSelector(); st.selr.at = Date.now(); } await loadLive(); }
    if (!st.page && st.tab === "backup" && !st.backupBusy) st.backup = { preview: await api("/api/backup/preview"), list: await api("/api/backup/list") };
    render();
  } catch (e) { $("#banner").replaceChildren(h("div", { class: "banner" }, "Cannot reach the server: " + e.message)); }
}
refresh().then(route);
setInterval(() => { if (st.tab === "live" && !st.page) { if ($("#modal").hidden) refresh(); else loadLive().catch(() => {}); } else if (!document.hidden && $("#modal").hidden) refresh(); }, 3000);   // the Live desk keeps polling in the background (sounds)
</script>
</body>
</html>
